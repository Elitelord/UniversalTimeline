name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Publish Windows Client
      run: dotnet publish -c Release -o publish -p:SupabaseUrl="${{ secrets.SUPABASE_URL }}" -p:SupabaseAnonKey="${{ secrets.SUPABASE_ANON_KEY }}" -p:BackendApiUrl="${{ secrets.BACKEND_API_URL }}"
      working-directory: ./client/windows/UniversalTimeline.Client
    - name: Install Velopack CLI
      run: dotnet tool install -g vpk
    - name: Build Velopack Installer
      run: |
        $ver = "${{ github.ref_name }}".TrimStart('v')
        vpk pack -u UniversalTimeline -v $ver -p client/windows/UniversalTimeline.Client/publish -e UniversalTimeline.Client.exe -o Releases
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: Releases/

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Compute version from tag
      run: |
        VER="${GITHUB_REF_NAME#v}"
        echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
        # versionCode must be a monotonically increasing int. Encode major.minor.patch
        # as MA*10000 + MI*100 + PA (valid while minor/patch stay < 100).
        IFS='.' read -r MA MI PA <<< "$VER"
        echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
    - name: Create local.properties
      run: |
        echo "supabase.url=${{ secrets.SUPABASE_URL }}" > local.properties
        echo "supabase.anon_key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
      working-directory: ./clients/android
    - name: Decode Keystore
      run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > clients/android/release-keystore.jks
    - name: Build Signed Release APK
      run: chmod +x gradlew && ./gradlew assembleRelease
      working-directory: ./clients/android
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/clients/android/release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        VERSION_NAME: ${{ env.VERSION_NAME }}
        VERSION_CODE: ${{ env.VERSION_CODE }}
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: clients/android/app/build/outputs/apk/release/app-release.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-release
        path: ./release-assets
    - name: Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./release-assets
    - name: Rename Android artifact
      run: mv ./release-assets/app-release.apk ./release-assets/UniversalTimeline-Android.apk
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          release-assets/*
